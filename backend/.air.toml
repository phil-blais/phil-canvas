root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ."
entrypoint = ["./tmp/main"]
include_ext = ["go"]
exclude_dir = ["tmp"]
exclude_regex = ["_test\\.go"]
delay = 200
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = false

[misc]
clean_on_exit = true

[screen]
clear_on_rebuild = true
